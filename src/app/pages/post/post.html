@if (post(); as p) {
  <article class="post">
    <a routerLink="/" class="voltar">← Voltar para a Home</a>
    <h1>{{ p.titulo }}</h1>
    <time>{{ p.data }}</time>
    <img [src]="p.imagem" [alt]="p.titulo" />
    <p class="resumo">{{ p.resumo }}</p>
    <div class="conteudo">{{ p.conteudo }}</div>
  </article>
} @else {
  <p class="carregando">Carregando post...</p>
}
